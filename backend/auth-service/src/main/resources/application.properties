spring.application.name=auth-service

server.port=${AUTH_PORT:8081}
spring.config.import=optional:file:../.env[.properties],optional:file:./application-local.properties

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/treasury}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET:mySuperSecretKeyForJWTTokenGeneration12345678901234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

transaction.service.url=${TRANSACTION_SERVICE_URL:http://localhost:8082}
transaction.service.timeout=${TRANSACTION_SERVICE_TIMEOUT:5000}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://treasurytracker-front.onrender.com}

# Resilience4j
resilience4j.circuitbreaker.instances.transactionService.sliding-window-size=10
resilience4j.circuitbreaker.instances.transactionService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.transactionService.wait-duration-in-open-state=10s
resilience4j.retry.instances.transactionService.max-attempts=3
resilience4j.retry.instances.transactionService.wait-duration=1s

logging.level.com.mvm.auth=INFO
logging.level.org.springframework.security=WARN

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/auth-service.log
logging.file.max-size=10MB
logging.file.max-history=30

management.endpoints.web.exposure.include=health,info,prometheus